syntax = "proto3";

package pertisk.machine.v1alpha1;

option go_package = "github.com/pertisk-tech/pertisk-kos/api/machine/v1alpha1";

// MachineService is the node management API (Talos-shaped, not wire-compatible).
service MachineService {
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ValidateConfiguration(ApplyConfigurationRequest) returns (ValidateConfigurationResponse);
  rpc ApplyConfiguration(ApplyConfigurationRequest) returns (ApplyConfigurationResponse);
  rpc Reboot(RebootRequest) returns (RebootResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  rpc ServiceList(ServiceListRequest) returns (ServiceListResponse);
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
  rpc MarkBootGood(MarkBootGoodRequest) returns (MarkBootGoodResponse);
  rpc UpgradeStatus(UpgradeStatusRequest) returns (UpgradeStatusResponse);
  // Tail recent log lines for a node service (or kernel dmesg).
  rpc Logs(LogsRequest) returns (LogsResponse);
  // Bootstrap the first control-plane (PKI + static pods). Idempotent.
  rpc Bootstrap(BootstrapRequest) returns (BootstrapResponse);
  // Fetch admin kubeconfig after bootstrap (control-plane only).
  rpc Kubeconfig(KubeconfigRequest) returns (KubeconfigResponse);
  // Join this node as an additional stacked control plane (shared CA in config).
  rpc JoinControlPlane(JoinControlPlaneRequest) returns (JoinControlPlaneResponse);
  // Export worker + controlplane-join YAML (includes caKey/saKey) from a bootstrapped CP.
  rpc GetJoinConfig(GetJoinConfigRequest) returns (GetJoinConfigResponse);
  // Expand EPHEMERAL GPT + ext4 after hypervisor disk resize (safe while /var mounted).
  rpc GrowDisk(GrowDiskRequest) returns (GrowDiskResponse);
  // Read TPM PCR digests (sysfs lab path) + active boot slot/version.
  rpc Attest(AttestRequest) returns (AttestResponse);
  // List containers via containerd `ctr` (k8s.io namespace).
  rpc Containers(ContainersRequest) returns (ContainersResponse);
  // TPM2 Quote over /dev/tpmrm0 (ephemeral ECC AK; lab, no libtss2).
  rpc Quote(QuoteRequest) returns (QuoteResponse);
  // Write a live etcd DB snapshot to disk (control-plane).
  rpc EtcdSnapshot(EtcdSnapshotRequest) returns (EtcdSnapshotResponse);
  // Offline restore of an etcd snapshot into /var/lib/etcd (destructive; force required).
  rpc EtcdRestore(EtcdRestoreRequest) returns (EtcdRestoreResponse);
}

message VersionRequest {}

message VersionResponse {
  string version = 1;
  string api_version = 2;
  string platform = 3;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string message = 2;
  string containerd = 3;
  string kubelet = 4;
}

message ApplyConfigurationRequest {
  // Full machine config YAML (v1alpha1).
  string yaml = 1;
}

message ValidateConfigurationResponse {
  bool ok = 1;
  string message = 2;
}

message ApplyConfigurationResponse {
  bool ok = 1;
  string message = 2;
  string path = 3;
}

message RebootRequest {
  // Soft reboot request; node schedules reboot after RPC returns.
  bool graceful = 1;
}

message RebootResponse {
  bool accepted = 1;
  string message = 2;
}

message ShutdownRequest {
  bool graceful = 1;
}

message ShutdownResponse {
  bool accepted = 1;
  string message = 2;
}

message ServiceListRequest {}

message ServiceStatus {
  string name = 1;
  string state = 2; // up | down | absent
  uint32 pid = 3;
}

message ServiceListResponse {
  repeated ServiceStatus services = 1;
}

message UpgradeRequest {
  // Absolute path on the node to a verified-ready bundle directory
  // (manifest.json, manifest.sig, artifacts).
  string bundle_path = 1;
  // If true, schedule reboot after staging the inactive slot.
  bool reboot = 2;
}

message UpgradeResponse {
  bool ok = 1;
  string message = 2;
  string target_slot = 3;
  string version = 4;
}

message MarkBootGoodRequest {}

message MarkBootGoodResponse {
  bool ok = 1;
  string message = 2;
  string active_slot = 3;
}

message UpgradeStatusRequest {}

message UpgradeStatusResponse {
  string active_slot = 1;
  string next_slot = 2;
  string previous_good = 3;
  uint32 boot_attempts = 4;
  bool boot_ok = 5;
  string active_version = 6;
  string pending_version = 7;
}

message LogsRequest {
  // pertiskd | containerd | kubelet | dmesg
  string service = 1;
  // Number of trailing lines (default 100, max 5000).
  uint32 tail_lines = 2;
}

message LogsResponse {
  string service = 1;
  repeated string lines = 2;
  string source = 3; // path or "dmesg"
}

message BootstrapRequest {
  // Optional advertise IP (defaults to first non-loopback IPv4 on the node).
  string advertise_address = 1;
}

message BootstrapResponse {
  bool ok = 1;
  string message = 2;
  bool already_bootstrapped = 3;
}

message KubeconfigRequest {}

message KubeconfigResponse {
  // admin.conf YAML
  string kubeconfig = 1;
}

message JoinControlPlaneRequest {
  // Optional advertise IP (defaults to first non-loopback IPv4 on the node).
  string advertise_address = 1;
  // Existing etcd member client URLs, e.g. https://10.1.1.10:2379
  repeated string etcd_endpoints = 2;
}

message JoinControlPlaneResponse {
  bool ok = 1;
  string message = 2;
  bool already_joined = 3;
}

message GetJoinConfigRequest {
  // When true, include controlplane-join YAML with caKey/saKey.
  bool controlplane = 1;
  // Hostname index for generated CP YAML (e.g. 2 → <cluster>-cp-2). 0 = generic.
  uint32 controlplane_index = 2;
  // Cluster name prefix for hostnames (default from applied hostname prefix).
  string cluster_name = 3;
}

message GetJoinConfigResponse {
  bool ok = 1;
  string message = 2;
  string worker_yaml = 3;
  string controlplane_yaml = 4;
  repeated string etcd_endpoints = 5;
  string ca_pem = 6;
}

message GrowDiskRequest {}

message GrowDiskResponse {
  bool ok = 1;
  string message = 2;
  bool partition_grew = 3;
  bool filesystem_grew = 4;
}

message AttestRequest {}

message PcrValue {
  uint32 index = 1;
  string algo = 2;
  string digest_hex = 3;
}

message AttestResponse {
  // True when a TPM sysfs bank was found and at least one PCR was read.
  bool available = 1;
  string message = 2;
  string active_slot = 3;
  string version = 4;
  repeated PcrValue pcrs = 5;
}

message ContainersRequest {}

message ContainerInfo {
  string id = 1;
  string name = 2;
  string image = 3;
  // running | created | stopped | unknown
  string state = 4;
  // containerd namespace (k8s.io for kubelet pods)
  string namespace = 5;
  // sandbox | container | unknown (from io.cri-containerd.kind)
  string kind = 6;
  // io.kubernetes.pod.name
  string pod_name = 7;
  // io.kubernetes.pod.namespace
  string pod_namespace = 8;
}

message ContainersResponse {
  bool available = 1;
  string message = 2;
  repeated ContainerInfo containers = 3;
}

message QuoteRequest {
  // qualifyingData; empty → server generates 32 random bytes.
  bytes nonce = 1;
}

message QuoteResponse {
  bool available = 1;
  string message = 2;
  bytes nonce = 3;
  // TPMS_ATTEST (contents of TPM2B_ATTEST).
  bytes quoted = 4;
  // Marshaled TPMT_SIGNATURE (ECDSA-SHA256).
  bytes signature = 5;
  // TPMT_PUBLIC for the ephemeral AK.
  bytes ak_public = 6;
  repeated PcrValue pcrs = 7;
  string active_slot = 8;
  string version = 9;
}

message EtcdSnapshotRequest {
  // Destination path; empty → /var/lib/pertisk/etcd-snapshots/snapshot-<unix>.db
  string output_path = 1;
}

message EtcdSnapshotResponse {
  bool available = 1;
  string message = 2;
  string path = 3;
  uint64 size_bytes = 4;
  int64 revision = 5;
}

message EtcdRestoreRequest {
  string snapshot_path = 1;
  // Must be true — restore replaces local /var/lib/etcd.
  bool force = 2;
  // Optional etcd member name (default: machine hostname).
  string member_name = 3;
  // Optional initial-cluster (default: name=https://<advertise>:2380).
  string initial_cluster = 4;
  // Optional advertise peer URL (default: https://<advertise>:2380).
  string peer_url = 5;
  // Optional advertise IP used when defaults are derived.
  string advertise_address = 6;
}

message EtcdRestoreResponse {
  bool ok = 1;
  string message = 2;
}
