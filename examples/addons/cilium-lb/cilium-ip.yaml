# Cilium L2 LoadBalancer pool. Replace IPv4 / IPv6 CIDRs.
# Dual-stack: keep both blocks. IPv4-only: drop the IPv6 block.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: default-pool
spec:
  blocks:
    - cidr: 10.1.1.50/32
    - cidr: 2001:db8::1/128
  disabled: false
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default-l2-announcement-policy
spec:
  externalIPs: true
  loadBalancerIPs: true
