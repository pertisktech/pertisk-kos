# Wildcard Certificate issued by ClusterIssuer letsencrypt-cloudflare.
# kubernetes-reflector copies the TLS Secret into every namespace.
#
# The management UI generates this from Add-ons → Certificates → Wildcard domain.
# Replace DOMAIN (e.g. vsphere.pertisk.com) and apply after cert-manager + ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vsphere-pertisk-com-tls
  namespace: cert-manager
spec:
  secretName: vsphere-pertisk-com-tls
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  isCA: false
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  dnsNames:
    - "*.vsphere.pertisk.com"
    - vsphere.pertisk.com
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
    group: cert-manager.io
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
