version: v1alpha1
machine:
  type: worker
  network:
    hostname: pertisk-cp-1
    interfaces:
      - interface: eth0
        dhcp: true
cluster:
  endpoint: https://192.168.1.10:6443
  token: <bootstrap-token>
  # Built-in bridge CNI (default). For Flannel/Cilium use examples/worker-join-flannel.yaml.
  cni: bridge
  podCidr: 10.244.0.0/24
