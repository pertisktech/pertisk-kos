global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  # Nodes PUT /metrics/job/pertisk/instance/<hostname> (same idea as Loki push).
  # Prometheus uses host network, so Pushgateway is localhost:9091.
  - job_name: pertisk
    honor_labels: true
    scrape_interval: 15s
    static_configs:
      - targets:
          - 127.0.0.1:9091

  # Pull guest :50001 (host network required — Docker bridge cannot reach VMs).
  - job_name: pertisk-nodes
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/*.yml
        refresh_interval: 30s
