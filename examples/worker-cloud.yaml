version: v1alpha1
machine:
  type: worker
  # No install: disk is pre-imaged for cloud / golden QEMU.
  # Hostname is overwritten at populate time (GUID-wk / GUID-cp); do not rely on this value.
  network:
    hostname: seed-wk
    interfaces:
      - interface: eth0
        dhcp: true
    nameservers:
      - 1.1.1.1
# Optional: join an existing control plane
# cluster:
#   endpoint: https://10.0.0.10:6443
#   token: <bootstrap-token>
#   podCidr: 10.244.0.0/24
