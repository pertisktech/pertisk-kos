version: v1alpha1
machine:
  type: worker
  network:
    hostname: pertisk-worker-1
    interfaces:
      - interface: eth0
        dhcp: true
cluster:
  endpoint: https://192.168.1.10:6443
  token: <bootstrap-token>
  # Leave pod networking to a cluster CNI DaemonSet (Flannel / Cilium / …).
  cni: none
