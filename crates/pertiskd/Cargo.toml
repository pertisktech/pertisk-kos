[package]
name = "pertiskd"
description = "Pertisk KOS init and node supervisor (PID 1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pertiskd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = "0.28"
libc = "0.2"
nix = { workspace = true }
pertisk-api = { workspace = true }
pertisk-bootstrap = { workspace = true }
pertisk-config = { workspace = true }
pertisk-disk = { workspace = true }
pertisk-kubelet = { workspace = true }
pertisk-net = { workspace = true }
pertisk-runtime = { workspace = true }
pertisk-update = { workspace = true }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
