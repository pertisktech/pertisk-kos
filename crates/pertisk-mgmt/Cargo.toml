[package]
name = "pertisk-mgmt"
description = "Pertisk cluster management API + embedded UI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "pertisk-mgmt"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
portable-pty = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { workspace = true }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
# jsonwebtoken 10.x requires exactly one of rust_crypto | aws_lc_rs (or a manual CryptoProvider).
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
mime_guess = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "cookies"] }
rust-embed = { version = "8", features = ["mime_guess"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
aes-gcm = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder"] }
pertisk-config = { workspace = true }
pertisk-tpm = { workspace = true }
# Enabled only for cargo-zigbuild (no target OpenSSL sysroot).
openssl = { version = "0.10", optional = true }

[features]
default = []
vendored-openssl = ["dep:openssl", "openssl/vendored"]

[dev-dependencies]
tempfile = "3"
