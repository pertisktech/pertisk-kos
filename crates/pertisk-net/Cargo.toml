[package]
name = "pertisk-net"
description = "Pertisk KOS host networking and DNS"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
pertisk-config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
dhcproto = "0.12"
futures = "0.3"
ipnet = "2"
netlink-packet-route = "0.19"
rand = "0.8"
rtnetlink = "0.14"
socket2 = { version = "0.5", features = ["all"] }
# Pin: newer url pulls icu_* needing rustc ≥ 1.86; Docker builder is 1.85.
url = "=2.4.1"

[[bin]]
name = "pertisk-udhcpc-hook"
path = "src/bin/pertisk-udhcpc-hook.rs"
