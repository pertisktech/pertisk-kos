version: v1alpha1
machine:
  type: worker
  # No install block: cloud/golden images are pre-partitioned.
  # Metal first-boot install uses examples/worker-install.yaml (or PERTISK_CONFIG).
  network:
    hostname: pertisk-1
    interfaces:
      - interface: eth0
        dhcp: true
    nameservers:
      - 1.1.1.1
