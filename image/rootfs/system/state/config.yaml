version: v1alpha1
machine:
  type: worker
  # No install block: cloud/golden images are pre-partitioned.
  # Metal first-boot install uses examples/worker-install.yaml (or PERTISK_CONFIG).
  # Hostname overwritten at image populate (GUID-wk / GUID-cp).
  network:
    hostname: seed-wk
    interfaces:
      - interface: eth0
        dhcp: true
    nameservers:
      - 1.1.1.1
